[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "win-utils"
version = "0.1.0"
description = "Small command-line utilities for Windows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
longpaths = "winutils.longpaths.cli:main"
recent = "winutils.recent.cli:main"

[tool.setuptools.packages.find]
include = ["winutils*"]
